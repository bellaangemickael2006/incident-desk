name: security-pipeline
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
  security-events: write

jobs:
  sast:
    name: SAST — Bandit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Bandit
        run: pip install bandit[sarif]
      - name: Run Bandit
        run: |
          bandit -r . \
            --exclude ./.venv,./exercises,./staticfiles \
            --format sarif \
            --output bandit-results.sarif \
            --severity-level medium \
            --confidence-level medium || true
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit-results.sarif

  dependency-audit:
    name: Dependency audit — pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies
        run: pip-audit -r requirements.txt --format json --output pip-audit-results.json || true
      - name: Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-results
          path: pip-audit-results.json

  secret-scan:
    name: Secret scan — detect-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install detect-secrets
        run: pip install detect-secrets
      - name: Scan for secrets
        run: |
          detect-secrets scan \
            --exclude-files '.venv/.*' \
            --exclude-files 'staticfiles/.*' \
            --exclude-files '.*\.sqlite3' \
            > .secrets.baseline
          detect-secrets audit .secrets.baseline --only-allowlisted || true
          python -c "
          import json, sys
          with open('.secrets.baseline') as f:
              b = json.load(f)
          found = sum(len(v) for v in b.get('results', {}).values())
          print(f'detect-secrets: {found} potential secrets found')
          if found > 0:
              sys.exit(1)
          "

  dast:
    name: DAST — ZAP baseline (authenticated)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
        env:
          POSTGRES_DB: incidentdesk
          POSTGRES_USER: incidentdesk
          POSTGRES_PASSWORD: dast-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incidentdesk -d incidentdesk"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://incidentdesk:dast-ci-only@127.0.0.1:5432/incidentdesk
      DJANGO_SECRET_KEY: dast-ci-disposable-key-not-for-production-1234567890
      DJANGO_SETTINGS_MODULE: config.settings.ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install app
        run: pip install -r requirements.txt
      - name: Migrate and seed DAST users
        run: |
          python manage.py migrate --noinput
          python manage.py shell -c "
          from django.contrib.auth import get_user_model
          User = get_user_model()
          User.objects.create_user('zap-scanner', password='ZapScan!2026ci', email='zap@scan.local')
          print('DAST user created')
          "
      - name: Start app server
        run: |
          python manage.py runserver 127.0.0.1:8000 &
          sleep 5
          curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/accounts/login/ | grep 200
      - name: ZAP baseline scan (scope: incident-desk only)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://127.0.0.1:8000'
          allow_issue_writing: false
          fail_action: false
          cmd_options: '-I -n context.context -c zap-config.yaml'
        continue-on-error: true
      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report_html.html
