name: starter-tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
# Required GitHub secrets for Vercel deployment:
#   VERCEL_TOKEN    — from vercel.com → Settings → Tokens
#   VERCEL_ORG_ID   — from .vercel/project.json "orgId"
#   VERCEL_PROJECT_ID — from .vercel/project.json "projectId"
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - run: python manage.py test --settings=config.settings.test
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
        env:
          POSTGRES_DB: incidentdesk
          POSTGRES_USER: incidentdesk
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incidentdesk -d incidentdesk"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://incidentdesk:ci-only-password@127.0.0.1:5432/incidentdesk
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py migrate --noinput --settings=config.settings.ci
      - run: python manage.py test --settings=config.settings.ci

  deploy:
    runs-on: ubuntu-latest
    needs: [tests, postgres]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        run: npx vercel --prod --token "$VERCEL_TOKEN" --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
